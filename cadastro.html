<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SOS Jamaica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SOS Jamaica</h1>
        <p>Ajudem a pessoas atingidas pelo furacão na Jamaica</p>
        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#projetos">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastre-se como Voluntários</h2>
            <form id="formCadastro">
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="tipo">Quero ajudar como:</label><br>
                <select id="tipo" name="tipo">
                    <option>Voluntário</option>
                    <option>Doador</option>
                </select><br><br>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 SOS Jamaica - Solidariedade que transforma vidas</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
